name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: 准备临时签名配置
        run: |
          cd simple_live_app/android
          echo "android.newDsl=false" >> gradle.properties
          echo "android.builtInKotlin=false" >> gradle.properties
          cat > app/keystore.properties <<EOF
keyAlias=temp
keyPassword=temp123
storeFile=temp.keystore
storePassword=temp123
EOF

      - name: 修复gradle.kts类型转换（核心！）
        run: |
          cd simple_live_app/android/app
          sed -i 's/keyAlias = keystoreProperties\["keyAlias"\] as String/keyAlias = keystoreProperties["keyAlias"] as String? ?: ""/' build.gradle.kts
          sed -i 's/keyPassword = keystoreProperties\["keyPassword"\] as String/keyPassword = keystoreProperties["keyPassword"] as String? ?: ""/' build.gradle.kts
          sed -i 's/storePassword = keystoreProperties\["storePassword"\] as String/storePassword = keystoreProperties["storePassword"] as String? ?: ""/' build.gradle.kts

      - name: Fetch dependencies
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/
