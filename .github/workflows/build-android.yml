name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Prepare keystore config
        run: |
          cd simple_live_app/android
          echo "android.newDsl=false" >> gradle.properties
          echo "android.builtInKotlin=false" >> gradle.properties
          echo "keyAlias=temp" > app/keystore.properties
          echo "keyPassword=temp123" >> app/keystore.properties
          echo "storeFile=temp.keystore" >> app/keystore.properties
          echo "storePassword=temp123" >> app/keystore.properties

      - name: Fix gradle.kts type cast
        run: |
          cd simple_live_app/android/app
          sed -i 's/keyAlias = keystoreProperties\["keyAlias"\] as String/keyAlias = keystoreProperties["keyAlias"] as String? ?: ""/' build.gradle.kts
          sed -i 's/keyPassword = keystoreProperties\["keyPassword"\] as String/keyPassword = keystoreProperties["keyPassword"] as String? ?: ""/' build.gradle.kts
          sed -i 's/storePassword = keystoreProperties\["storePassword"\] as String/storePassword = keystoreProperties["storePassword"] as String? ?: ""/' build.gradle.kts

      - name: Flutter pub get
        run: |
          cd simple_live_app
          flutter pub get

      # ========== 重点：patch auto_orientation_v2 插件的build.gradle ==========
      - name: Patch auto_orientation_v2 fix jvmTarget
        run: |
          cd simple_live_app
          FILE=$(find ~/.pub-cache/hosted/pub.dev/auto_orientation_v2-2.4.7/android/build.gradle)
          echo "Patching $FILE"
          # 把 jvmTarget = "1.8" 替换成新版本枚举写法
          sed -i 's/jvmTarget = "1.8"/jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_18/g' "$FILE"

      - name: Build Release APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/
