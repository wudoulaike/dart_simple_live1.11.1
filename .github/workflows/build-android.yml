name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Fetch dependencies
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build Release APK (skip gradle version check)
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/
