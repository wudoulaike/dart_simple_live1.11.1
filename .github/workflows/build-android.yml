name: Build Android APK
on:
  workflow_dispatch: # 手动触发，和Windows一样，点Run workflow

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Fetch dependencies
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi
        # --split-per-abi 会分arm64-v8a / armeabi-v7a 两个apk，国内手机大多arm64

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/
